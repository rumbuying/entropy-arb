# entropy-arb strategy configuration / 策略配置
#
#   cp config.example.yaml config.yaml     then edit / 复制后修改
#
# This file IS the strategy. Credentials never live here — they go in .env
# (see .env.example). Every key is validated: a typo is a startup error, not
# a setting that silently does nothing.
# 本文件就是策略本身。密钥绝不放在这里（见 .env.example）。所有键名都会被校验：
# 拼写错误会直接报错，而不是静默失效。
#
# WHICH MARKETS to trade is NOT in this file — you state it explicitly on
# every start with command-line flags:
#     python3 main.py --symbol SNDK --hedge lighter-rh
# Entropy is always one leg; --hedge picks the other:
#   lighter      Lighter mainnet            (USDC, 0 bps taker)
#   lighter-rh   Lighter Robinhood chain    (USDG, 0 bps taker)
#   tradexyz     Hyperliquid trade.xyz dex  (USDC, ~1 bps taker)
#   katana       Katana Perps               (USDC, ~1.9 bps taker; crypto
#                                           majors only — pair with the main
#                                           HL dex via entropy.dex: "")
# 交易哪个市场不在本文件中配置——每次启动时用命令行参数显式指定：
#     python3 main.py --symbol SNDK --hedge lighter-rh
# Entropy 永远是其中一条腿；--hedge 选择对冲腿（四选一，见上表）。

# ============================ THE SIGNAL / 信号 ============================
# premium_bps = (Entropy price / hedge price - 1) * 10000
#
#   SELL entropy + BUY hedge   when executable premium >= midline + upper
#   BUY entropy + SELL hedge   when executable premium <= midline - lower
#
# Both hurdles are net of taker fees (the engine adds fees on top), so one
# full round trip nets >= upper + lower bps after fees by construction.
#
# midline_bps is a number YOU derive from recorded data. Run the bot
# (--record-only) to collect logs/minutes.csv, then:  python3 tools/analyze.py
#
# midline_bps 是你根据采集数据设定的值。先运行机器人（--record-only）采集
# logs/minutes.csv，再运行 python3 tools/analyze.py 获取建议值。
# 两个方向的门槛都已扣除手续费（引擎会在此之上另加手续费），因此一次完整往返
# 扣费后净赚 >= upper + lower bps。
thresholds:
  midline_bps: 0.0     # persistent premium center / 溢价长期中枢
  upper_bps: 4.0       # entry above midline: sell entropy / 中枢上方入场带宽
  lower_bps: 4.0       # entry below midline: buy entropy / 中枢下方入场带宽

# ======================== VENUES / 交易所参数 ==============================
entropy:
  dex: io                    # Entropy's dex name on Hyperliquid / Entropy 的 dex 名
                             # set "" for the MAIN Hyperliquid perp dex (BTC,
                             # ETH, ... — deep crypto majors, e.g. to pair with
                             # katana). 设为 "" 表示 HL 主 dex 的大盘币种
  taker_fee_bps: 0.0         # taker fee / 吃单手续费
  max_position_usd: 1000     # position cap / 持仓上限（美元）
  max_orders_per_min: 120    # order-send budget, sliding 60s / 每分钟下单预算

hedge:
  taker_fee_bps: 0.0         # Lighter venues: 0; tradexyz: ~1.0; katana: ~1.9
  max_position_usd: 1000
  max_orders_per_min: 30     # Lighter's ceiling is ~40/min / Lighter 上限约 40/分钟
  # symbol: ANTHROPIC        # hedge-leg ticker when the two venues name the
                             # same market differently (e.g. entropy "ANTH" on
                             # the io dex vs "ANTHROPIC" on lighter-rh, or
                             # "BTC" on HL main vs "BTC-USD" on katana).
                             # Defaults to --symbol. / 对冲腿标的别名，缺省同 --symbol

# ============== SESSION-AWARE BAND AUTO-CALIBRATION / 分时段band自校准 ======
# tools/auto_band.py (run by entropy-autoband.timer every 5 min) rewrites the
# thresholds block above: midline = current ET session's trailing-median
# premium, width = max(width_k * session stdev, 2 * measured slippage,
# min_width_bps). The running engine hot-reloads the file within ~60s.
# 启用后由调度器按美东时段自动改写上方 thresholds：midline=该时段滚动中位数，
# 宽度=max(2.5×时段波动率, 2×实测滑点, min_width_bps)，引擎约60秒内热加载
auto_band:
  enabled: true
  window_days: 7             # trailing calibration window / 回看窗口（天）
  width_k: 2.5               # width = width_k * session stdev / 宽度系数
  min_width_bps: 5.0         # hard floor / 宽度下限
  sigma_halflife_h: 24       # recency-weighted stdev half-life (0 = plain) / σ 半衰期（小时），0 为普通标准差
  slip_lookback_days: 2      # slippage floor's own lookback / 实测滑点独立回看期（天）
  slip_min_fills: 5          # floor needs this many complete fills / 完整成交少于该数则滑点下限不生效
  skip_engine_down_min: 15   # skip profile when engine log idle this long / 引擎日志静默超时则跳过校准

# ======================== MAKER MODE / 挂单模式 =============================
# maker.enabled: true switches to the maker strategy: rest post-only quotes
# on the hedge venue (e.g. --hedge katana), hedge every fill instantly on the
# base leg with a taker order, and lock premium-minus-costs per fill.
# Mutually exclusive with the taker band strategy (which it disables).
# The hedge venue must implement the maker contract (maker_capable —
# currently only katana). See MAKER-DESIGN.md for the full design.
#
# maker.enabled: true 切换为挂单策略：在对冲腿（如 --hedge katana）以 post-only
# 挂单吸收流量，成交瞬间在基准腿吃单对冲，锁定"溢价−成本"的净边际。
# 与 taker band 策略互斥（启用后 band 扫描停止）。对冲腿必须实现挂单契约
# （maker_capable——目前仅 katana）。完整设计见 MAKER-DESIGN.md。
maker:
  enabled: false
  edge_bps: 2.0              # target net locked edge per fill / 每笔目标净锁利
  costs_bps: 5.5             # maker费+hedge吃单费+滑点估计（katana+HL主网≈5.5）
  requote_bps: 1.0           # anchor move that requotes / 锚移动重挂阈值
  requote_sec: 30            # heartbeat requote / 挂单最长存活时间
  size_base: 0.005           # per-side quote size (base units) / 单边挂单量
  sides: both                # both | bid | ask
  hedge_batch_ms: 250        # fill→hedge aggregation window / 成交对冲合并窗口
  max_hedge_failures: 3      # failures before EXPOSED halt / 对冲连续失败停机阈值
  hedge_retry_sec: 0.5       # hedge retry backoff / 对冲重试间隔
  interval_sec: 0.5          # quote-loop tick / 报价循环周期
  vol_widen_k: 2.0           # adaptive widen = k × stdev(basis,1m bars)；0 关闭
  vol_widen_window_min: 120  # basis history window for the stdev / 波动统计窗口（分钟）
  vol_widen_cap_bps: 15.0    # max widen / 波动加宽上限（bps；离场侧只加一半）
  trades_csv: logs/maker-trades.csv
  selection_csv: logs/maker-selection.csv

# ========================= SIZING / 下单规模 ===============================
sizing:
  take_fraction: 0.5           # fraction of crossable depth to take / 吃掉可套利深度的比例
  max_order_notional_usd: 500  # per-slice cap / 单笔名义上限
  min_order_notional_usd: 10   # skip dust / 低于此名义不下单

# ==================== INVENTORY LADDER / 库存阶梯 ==========================
# Extra bps required once a venue's position passes floor_frac of its cap in
# the adding direction — ramps linearly to scale_bps at 100% of the cap.
# Slows down one-sided accumulation without hard-stopping the strategy.
# 当某交易所持仓超过上限的 floor_frac 后，同方向继续加仓需额外溢价，线性增加到
# 满仓时的 scale_bps。避免单边持仓快速堆满。 scale_bps: 0 disables / 0 为关闭。
inventory:
  scale_bps: 10.0
  floor_frac: 0

# ======================= EXECUTION / 执行参数 ==============================
execution:
  premium_persist_sec: 0     # edge must persist this long before firing / 信号需持续时间
  cooldown_sec: 0.0            # min gap between executions / 两次执行的最小间隔
  settle_timeout_sec: 10.0      # wait for fill confirmation / 等待成交确认
  leg_slippage_bps: 50.0       # taker limit protection per leg / 每腿滑点保护
  hedge_slippage_bps: 20.0     # price protection on delta hedges / 对冲滑点保护
  net_tolerance_base: 0.001    # max tolerated net delta (base units) / 允许的净敞口
  max_consecutive_errors: 3    # halt after N straight failures / 连续失败 N 次后停机
  rate_limit_pause_sec: 10.0   # pause a 429'd venue this long / 被限频后的暂停时长
  # refuse signals whose executable edge exceeds this (bps; 0 = off). Edges
  # far outside the band are almost always a phantom top-of-book: the entry
  # leg never fills while the hedge leg does. / 超过此可成交边际的信号直接放弃
  #（远超 band 的偏移基本是幻影盘口：入场腿不成交、对冲腿成交，来回亏损）
  max_signal_edge_bps: 0
  staleness_sec: 10.0          # a feed older than this is stale / 行情超时判定
  reconcile_sec: 15.0          # on-chain position sync cadence / 链上持仓核对周期
  venue_probe_sec: 30.0        # probe cadence for a down venue / 故障交易所探测周期
  http_keepalive_sec: 10.0     # keep order-path TLS warm; 0 = off / 订单链路保活

# ================== DATA RECORDER / 数据采集 ===============================
# Always-on while the bot runs: samples both real order books 1/sec and
# writes one CSV row per minute. This is the input for tools/analyze.py.
# 机器人运行期间自动开启：每秒采样两边真实盘口，每分钟写一行 CSV，
# 供 tools/analyze.py 分析并设定上方 thresholds。
recorder:
  enabled: true
  csv: logs/minutes.csv
  # 丢弃顶档价差超过该值（bps）的 1s 采样：薄盘偶尔会留一张远离的挂单，
  # 它会把 mid 溢价撑到几百 bps，并造出无法成交的"假信号"。0 = 不过滤。
  max_spread_bps: 50

# ==================== LOGGING & DASHBOARD / 日志与仪表盘 ====================
# On a terminal the bot shows a live Rich dashboard (books, signal, positions,
# PnL, recent executions); log lines then go to `file` instead of the console.
# Off-terminal runs (nohup/systemd) fall back to plain console logs
# automatically; --no-dashboard forces that.
# 在终端运行时显示实时 Rich 仪表盘（盘口、信号、持仓、盈亏、最近成交），
# 日志写入 `file` 而不再打印到屏幕。非终端环境（nohup/systemd）自动退回
# 纯日志模式；也可用 --no-dashboard 强制关闭。
logging:
  level: INFO
  status_interval_sec: 30.0
  trades_csv: logs/trades.csv
  dashboard: true
  file: logs/engine.log

# ==================== WEB OVERVIEW / 网页总览 ==============================
# Optional read-only web page served by the engine process itself: books,
# signal vs hurdles with a live premium chart, positions, PnL, executions.
# No control endpoints exist here — configuration/lifecycle live in the
# console (python3 console.py). Also available ad hoc via `--web [PORT]`.
# 可选的只读网页：由引擎进程自己提供（盘口、信号 vs 门槛 + 实时溢价图、
# 持仓、盈亏、成交）。没有任何控制接口——配置与生命周期管理在控制台
# （python3 console.py）。也可临时用 `--web [端口]` 开启。
web:
  enabled: false
  host: 127.0.0.1   # keep loopback unless you know what you expose / 保持回环
  port: 8787
