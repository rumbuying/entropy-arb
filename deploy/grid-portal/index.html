<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>entropy-grid — 网格服务入口</title>
<script>
/* Apply the saved theme before first paint (same key as the consoles). */
(function () {
  try {
    var t = localStorage.getItem("entropy-theme");
    if (t === "light") document.documentElement.classList.add("light");
  } catch (e) {}
})();
</script>
<style>
  :root {
    --bg: #05080f; --panel: #0b1119; --panel-2: #080d15;
    --border: rgba(148, 163, 184, .14);
    --text: #e8eef7; --dim: #8593a8; --accent: #2fe1b8; --accent-2: #818cf8;
    --green: #34d399; --blue: #5ea2ff;
    --mono: "JetBrains Mono", "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
    --grad-brand: linear-gradient(120deg, #2fe1b8, #38bdf8 55%, #818cf8);
    --card-glow: 0 12px 32px -14px rgba(0, 0, 0, .55);
  }

  html.light {
    --bg: #f2f5f9; --panel: #ffffff; --panel-2: #eef2f7; --border: #d9e1ea;
    --text: #17222f; --dim: #64748b; --accent: #0d9488; --accent-2: #6366f1;
    --green: #189a5c; --amber: #a16207;
    --card-glow: 0 1px 2px rgba(15, 23, 42, .05), 0 8px 24px -18px rgba(15, 23, 42, .18);
  }
  * { box-sizing: border-box; }
  ::selection { background: rgba(47, 225, 184, .28); }
  * { scrollbar-width: thin; scrollbar-color: rgba(148, 163, 184, .25) transparent; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    color: var(--text);
    font: 14px/1.5 "Inter", "SF Pro Text", -apple-system, "Segoe UI",
          "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(1100px 520px at 10% -10%, rgba(47, 225, 184, .075), transparent 62%),
      radial-gradient(950px 500px at 92% -14%, rgba(129, 140, 248, .065), transparent 58%),
      var(--bg);
    background-attachment: fixed;
  }
  html.light body {
    background:
      radial-gradient(1100px 520px at 10% -10%, rgba(13, 148, 136, .055), transparent 62%),
      radial-gradient(950px 500px at 92% -14%, rgba(99, 102, 241, .04), transparent 58%),
      var(--bg);
    background-attachment: fixed;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 26px 24px 6px; max-width: 980px; margin: 0 auto; width: 100%;
  }
  header::before {
    content: ""; flex: 0 0 auto;
    width: 34px; height: 34px; border-radius: 11px; align-self: center;
    background:
      radial-gradient(120% 120% at 20% 15%, rgba(255, 255, 255, .55), transparent 42%),
      var(--grad-brand);
    box-shadow: 0 0 20px rgba(47, 225, 184, .4), inset 0 1px 0 rgba(255, 255, 255, .4);
  }
  header .brand {
    display: flex; align-items: baseline; gap: 10px;
    font-weight: 750; font-size: 19px; letter-spacing: -.01em;
  }
  header .brand .accent { color: var(--accent); }
  header .sub { color: var(--dim); font-size: 13px; }
  main {
    flex: 1; max-width: 980px; width: 100%; margin: 0 auto;
    padding: 22px 24px 30px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-content: start;
  }
  a.card {
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; gap: 10px;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, .025), rgba(255, 255, 255, 0) 46%),
      var(--panel);
    border: 1px solid var(--border); border-radius: 16px;
    padding: 24px 22px 20px; text-decoration: none; color: var(--text);
    box-shadow: var(--card-glow);
    transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease;
  }
  html.light a.card { background: var(--panel); }
  a.card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent) 50%, transparent);
    opacity: 0; transition: opacity .18s ease;
  }
  a.card:hover {
    border-color: rgba(47, 225, 184, .4); transform: translateY(-3px);
    box-shadow: 0 18px 40px -14px rgba(0, 0, 0, .6), 0 0 24px -6px rgba(47, 225, 184, .18);
  }
  html.light a.card:hover { box-shadow: 0 12px 32px -12px rgba(15, 23, 42, .22); }
  a.card:hover::before { opacity: .7; }
  .card .head { display: flex; align-items: center; gap: 12px; }
  .card .icon {
    width: 42px; height: 42px; display: grid; place-items: center;
    font-size: 20px; border-radius: 12px;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, .04), rgba(255, 255, 255, 0)),
      color-mix(in srgb, var(--accent) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent);
  }
  .card .name { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  .card .venue {
    color: var(--accent); font-size: 11.5px; font-family: var(--mono); font-weight: 600;
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 26%, transparent);
    border-radius: 999px; padding: 2px 9px;
  }
  .card p { margin: 0; color: var(--dim); font-size: 13px; line-height: 1.6; }
  .card .go {
    margin-top: auto; padding-top: 6px; color: var(--accent);
    font-size: 13px; font-weight: 650;
  }
  .card .go::after { content: " →"; transition: margin-left .15s ease; display: inline-block; }
  a.card:hover .go::after { margin-left: 3px; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px; }
  .facts span {
    font-size: 11.5px; color: var(--dim); font-family: var(--mono);
    background: rgba(148, 163, 184, .1); border: 1px solid var(--border);
    border-radius: 999px; padding: 2.5px 9px;
  }
  .facts span.ok {
    color: #4ade9b; border-color: rgba(52, 211, 153, .32);
    background: rgba(52, 211, 153, .1);
  }
  html.light .facts span.ok {
    color: #0f7a49; border-color: rgba(24, 154, 92, .32);
    background: rgba(24, 154, 92, .09);
  }
  footer {
    max-width: 980px; width: 100%; margin: 0 auto;
    padding: 0 24px 24px; color: var(--dim); font-size: 12px; line-height: 1.7;
  }
  footer b { color: var(--text); font-weight: 600; }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="brand">entropy-grid <span class="accent">网格服务</span></div>
  <div class="sub">选择要打开的网格服务</div>
</header>
<main>
  <a class="card" href="/grid/hl/">
    <div class="head"><span class="icon">⚡</span><span class="name">HL 网格</span><span class="venue">Hyperliquid</span></div>
    <p>Hyperliquid 永续网格控制台。独立运行时与看护，与 Bulk 服务互不影响。</p>
    <div class="facts"><span class="ok">运行中</span><span>worker + web + watchdog</span><span>策略账号</span></div>
    <div class="go">打开控制台</div>
  </a>
  <a class="card" href="/grid/bulk/">
    <div class="head"><span class="icon">▦</span><span class="name">Bulk 网格</span><span class="venue">bulk.trade</span></div>
    <p>Bulk 永续网格控制台。13 个币种已开放，做多个网格，原生止损保护。</p>
    <div class="facts"><span class="ok">运行中</span><span>worker + web + watchdog</span><span>13 币种</span></div>
    <div class="go">打开控制台</div>
  </a>
</main>
<footer>
  两个服务共用同一登录凭据（打开时浏览器会自动带上）。运行时相互独立：一个服务的重启、看护或网络问题不影响另一个。
</footer>
<script>
  (function(){
    var KEY="entropy-theme";
    function apply(t){document.documentElement.classList.toggle("light",t==="light");
      var b=document.getElementById("theme-toggle");
      if(b){b.textContent=t==="light"?"🌙":"☀️";b.title=t==="light"?"切换深色模式":"切换浅色模式";}}
    try{apply(localStorage.getItem(KEY)||"dark");}catch(e){apply("dark");}
    var b=document.createElement("button");
    b.id="theme-toggle";
    b.style.cssText="position:fixed;right:14px;bottom:14px;z-index:300;width:38px;height:38px;"
      +"border-radius:50%;cursor:pointer;font-size:17px;opacity:.85;background:var(--panel);"
      +"color:var(--text);border:1px solid var(--border);padding:0;line-height:1;";
    b.onclick=function(){var t;try{t=localStorage.getItem(KEY)==="light"?"dark":"light";}catch(e){t="dark";}
      try{localStorage.setItem(KEY,t);}catch(e){} apply(t);};
    document.body.appendChild(b);apply((function(){try{return localStorage.getItem(KEY)||"dark";}catch(e){return "dark";}})());
  })();
  </script>
</body>
</html>
