<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>entropy-grid — 网格服务</title>
<script>
(function () {
  try {
    if (localStorage.getItem("entropy-theme") === "light") {
      document.documentElement.classList.add("light");
    }
  } catch (e) {}
})();
</script>
<style>
  :root {
    --bg: #0a0c10; --panel: #10131a; --panel-2: #0c0f14; --panel-3: #151922;
    --border: #1d222b; --border-strong: #2b323d; --line: #1a1f27;
    --text: #e6e9ef; --dim: #8a94a3; --muted: #5f6875;
    --accent: #37c8a0; --green: #2ebd85;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
            "Microsoft YaHei", "Helvetica Neue", sans-serif;
    --mono: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    --radius: 6px;
  }
  html.light {
    --bg: #f6f7f9; --panel: #ffffff; --panel-2: #fbfcfd; --panel-3: #f2f4f7;
    --border: #e4e7ec; --border-strong: #ccd2da; --line: #eaedf1;
    --text: #12161d; --dim: #5f6b7a; --muted: #8b95a3;
    --accent: #0f8f74; --green: #12855c;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); color-scheme: dark; }
  html.light { color-scheme: light; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--bg); color: var(--text);
    font: 13px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }

  header {
    display: flex; align-items: center; gap: 10px;
    height: 48px; padding: 0 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-2);
    position: sticky; top: 0; z-index: 10;
  }
  header .mark {
    width: 14px; height: 14px; border-radius: 3px; background: var(--accent);
    flex: 0 0 auto;
  }
  header b { font-size: 13px; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  header a.back, header .theme {
    height: 26px; padding: 0 10px; display: inline-flex; align-items: center;
    background: transparent; border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--dim); font: 500 11.5px var(--sans); cursor: pointer;
  }
  header a.back:hover, header .theme:hover { color: var(--text); border-color: var(--border-strong); }

  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 28px; }
  .page-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  .page-head h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  .page-head .meta { color: var(--muted); font-size: 12px; font-family: var(--mono); }

  .list {
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--panel); overflow: hidden;
  }
  a.row {
    display: grid;
    grid-template-columns: 150px 130px minmax(0, 1fr) 90px 76px;
    align-items: center; gap: 16px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    transition: background .12s ease;
  }
  a.row:last-child { border-bottom: 0; }
  a.row:hover { background: var(--panel-3); }
  .row .name { font-size: 13px; font-weight: 600; }
  .row .venue {
    font-family: var(--mono); font-size: 11px; color: var(--dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row .desc {
    color: var(--dim); font-size: 12px; line-height: 1.5;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row .state {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; color: #46c48f; white-space: nowrap;
  }
  .row .state::before {
    content: ""; width: 5px; height: 5px; border-radius: 50%;
    background: var(--green);
  }
  .row .go { text-align: right; font-size: 12px; color: var(--muted); font-family: var(--mono); }
  a.row:hover .go { color: var(--accent); }

  footer { margin-top: 14px; color: var(--muted); font-size: 11.5px; line-height: 1.7; }

  @media (max-width: 820px) {
    a.row { grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 12px; }
    .row .venue, .row .desc { grid-column: 1 / -1; }
    .row .desc { white-space: normal; }
    .row .state { grid-row: 1; grid-column: 2; justify-self: end; }
    .row .go { display: none; }
    header .sub { display: none; }
    main { padding: 14px 12px 24px; }
  }
</style>
</head>
<body>

<header>
  <span class="mark"></span>
  <b>entropy-grid</b>
  <span class="sub">网格服务</span>
  <span class="spacer"></span>
  <a class="back" href="/">全部服务</a>
  <button class="theme" id="theme-toggle" type="button">切换浅色</button>
</header>

<main>
  <div class="page-head">
    <h1>网格服务</h1>
    <span class="meta">2 个入口 · 独立运行时</span>
  </div>

  <div class="list">
    <a class="row" href="/grid/hl/">
      <span class="name">HL 网格</span>
      <span class="venue">Hyperliquid</span>
      <span class="desc">永续网格控制台，独立运行时与看护，与 Bulk 服务互不影响</span>
      <span class="state">运行中</span>
      <span class="go">打开 →</span>
    </a>
    <a class="row" href="/grid/bulk/">
      <span class="name">Bulk 网格</span>
      <span class="venue">bulk.trade</span>
      <span class="desc">永续网格控制台，13 个币种已开放，做多个网格，原生止损保护</span>
      <span class="state">运行中</span>
      <span class="go">打开 →</span>
    </a>
  </div>

  <footer>
    两个服务共用同一登录凭据（打开时浏览器会自动带上）。运行时相互独立：一个服务的重启、看护或网络问题不影响另一个。
  </footer>
</main>

<script>
(function () {
  "use strict";
  var btn = document.getElementById("theme-toggle");
  function label() {
    btn.textContent = document.documentElement.classList.contains("light")
      ? "切换深色" : "切换浅色";
  }
  btn.addEventListener("click", function () {
    var light = document.documentElement.classList.toggle("light");
    try { localStorage.setItem("entropy-theme", light ? "light" : "dark"); } catch (e) {}
    label();
  });
  label();
})();
</script>
</body>
</html>
