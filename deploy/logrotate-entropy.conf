# entropy-arb 日志轮转（进程持有文件句柄，必须用 copytruncate）
#
# 安装（root）:
#   cp deploy/logrotate-entropy.conf /etc/logrotate.d/entropy
#   chmod 644 /etc/logrotate.d/entropy
#
# 手动验证（不真轮转）:
#   logrotate -d /etc/logrotate.d/entropy

/root/code/entropy/logs/*.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

/root/code/entropy/logs/*.csv {
    monthly
    rotate 6
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
