[package]
name = "entropy-bulk-stop-legacy-identity"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Calls the protocol implementation itself; never an independently invented
# serialization or a hash of signing bytes. No signing key enters this tool.
bulk-client = { git = "https://github.com/Bulk-trade/bulk-client", rev = "303de5a8407c6c00ba8eaac2d1fa84dfabc4233c", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
solana-pubkey = "=3.0.0"
bincode = "=1.3.3"

[profile.release]
opt-level = 1
debug = false

