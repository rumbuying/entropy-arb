# INTC 观察线（record-only）：Backpack 美股永续 ↔ lighter-rh(Robinhood) INTC
#
#   2026-09-30 全重叠市场采样（logs/bp-rh-20260930，46min 隔夜）中唯一基差
#   波动够成本栈的市场：围绕中位 std 5.0bp（第二名 2.0），48% 分钟偏离 ≥5bp，
#   双向（sell>5bp 17% / buy>5bp 24% 分钟）。按 BACKPACK-PLAN §4 纪律
#   record-only 采集 ≥1–2 天（覆盖美盘时段）后再决定是否开 live。
#
# 成本栈: RH 两侧 0 费率（orderBooks 实测）+ BP taker tier1 5.0bp（实测）
#         + 半点差 ≈ 5.5–6bp → 门槛 sd ≥ 4bp（BACKPACK-PLAN 同款口径）
# 注意:   采样是隔夜数据；美盘时段（21:30–04:00 CST）波动数倍于隔夜，
#         autoband 分时段校准会自动跟随。观察期不交易。
thresholds:
  # 占位值（record-only 不交易；live 前由 auto_band 校准）
  # 口径: premium = Backpack(INTC.US) / lighter-rh(INTC) − 1
  midline_bps: -2.22
  upper_bps: 9.49
  lower_bps: 9.49

entropy:
  # INTC.US 在 Backpack 自动解析为 INTC.US_USDC_PERP
  symbol: INTC.US
  taker_fee_bps: 5.0        # BP tier1 实测
  max_position_usd: 50
  max_orders_per_min: 60

hedge:
  symbol: INTC              # lighter-rh 的符号
  taker_fee_bps: 0.0        # RH 两侧 0 费率（实测）
  max_position_usd: 50
  max_orders_per_min: 60

sizing:
  take_fraction: 0.5
  max_order_notional_usd: 40
  min_order_notional_usd: 10   # RH min_quote=$10

inventory:
  scale_bps: 10
  floor_frac: 0.5

execution:
  premium_persist_sec: 0.3
  cooldown_sec: 0
  leg_slippage_bps: 7
  hedge_slippage_bps: 20
  max_signal_edge_bps: 20   # 拒追 ±20bps 以外：薄盘大偏移基本是幻影
  max_consecutive_errors: 3
  staleness_sec: 10
  reconcile_sec: 15

recorder:
  enabled: true
  csv: logs/minutes-INTC.US-backpack-rh.csv

logging:
  file: logs/engine-INTC.US-backpack-rh.log
  trades_csv: logs/trades-INTC.US-backpack-rh.csv
  dashboard: false
  level: INFO

# 分时段 band 自动校准（同 sndk-rh 口径）：midline=当前美东时段滚动中位数，
# 宽度=max(k×时段std, 2×实测滑点, 5bps)
auto_band:
  enabled: true
  window_days: 3
  width_k: 2.0
  min_width_bps: 5.0
  sigma_halflife_h: 24
  slip_lookback_days: 2
  slip_min_fills: 5
  skip_engine_down_min: 15
