# Lighter-RH(Robinhood 链) ↔ Katana Perps — ZEC 线
#
#   record-only: python3 main.py --config profiles/lighter-rh-zec-katana.yaml \
#                    --symbol ZEC --base lighter-rh --hedge katana --record-only
#   live:        启用文件末尾的 maker 块
#
# 为什么选 rh 路线（9.5h rh probe 实测，见 logs/minutes-ZEC-lighter-rh-vs-katana.csv）：
#   溢价 median +7.82 / sd 3.04bp；rh 点差 2.65bp vs 主网 1.20bp
#   maker 往返成本 3.60bp → sd/成本 0.84；回测 132.1bp/天（rh）≈ 主网 139.7bp/天
#   taker 结构 9.20bp 成本、sd/成本 0.33 → **不可行，必须走 maker**
#   容量：KAT OI ~$17k（瓶颈）→ clip ≤ $1k
#   ⚠ Katana 的 ZEC 盘口极薄，历史上出现过 1687/2030bps 的坏行 → 必须靠
#     max_signal_edge_bps 挡住（本文件设 25bp ≈ 8σ）
thresholds:
  # 占位值，auto_band 按 rh 数据校准
  midline_bps: 7.8
  upper_bps: 8.0
  lower_bps: 8.0

entropy:
  symbol: ZEC
  taker_fee_bps: 0.0
  max_position_usd: 400      # 试点档（rh 20% 初始保证金 → 占用 $80）
  max_orders_per_min: 120

hedge:
  symbol: ZEC-USD
  taker_fee_bps: 1.9
  max_position_usd: 400
  max_orders_per_min: 30

sizing:
  take_fraction: 0.5
  max_order_notional_usd: 100
  min_order_notional_usd: 10

inventory:
  scale_bps: 10
  floor_frac: 0.5

execution:
  premium_persist_sec: 0.3
  cooldown_sec: 0
  leg_slippage_bps: 15
  hedge_slippage_bps: 18
  max_signal_edge_bps: 25    # 幻影过滤：ZEC 薄盘，历史上出现过 2000bp 假尖刺
  max_consecutive_errors: 3
  staleness_sec: 10
  reconcile_sec: 15

recorder:
  enabled: true
  csv: logs/minutes-ZEC-lighter-rh-katana.csv

logging:
  file: logs/engine-ZEC-lighter-rh-katana.log
  trades_csv: logs/trades-ZEC-lighter-rh-katana.csv
  dashboard: false
  level: INFO

auto_band:
  enabled: true
  window_days: 7
  width_k: 2.5
  min_width_bps: 5.0
  sigma_halflife_h: 24
  slip_lookback_days: 2
  slip_min_fills: 5
  skip_engine_down_min: 15

# maker 模式（唯一可行结构）
# costs_bps = KAT maker 0.475 + rh 吃单点半差 ~1.3 + 缓冲
#
maker:
  enabled: true
  edge_bps: 2.0
  costs_bps: 2.0           # KAT maker 0.475 + rh 吃单点半差 ~1.3 + 缓冲
  requote_bps: 1.0
  requote_sec: 20
  size_base: 0.12          # ~$187 @ $1557；KAT 最小 0.1 / step 0.001
  sides: both
  hedge_batch_ms: 250
  max_hedge_failures: 3
  hedge_retry_sec: 0.5
  interval_sec: 0.5
  trades_csv: logs/maker-trades-ZEC-lighter-rh.csv
  selection_csv: logs/maker-selection-ZEC-lighter-rh.csv
